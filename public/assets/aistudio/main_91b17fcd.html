<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeta Order &amp; Fuel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* Layout: login page with SOP flow, then a sticky top bar (logo, language, user) with tabs: Orders, Fuel, Report, Employees. Entries are added in modals.
   Report is a paper-style sheet that prints with the RH logo as a page watermark. */
:root{
  --bg:#f2f3ef;
  --surface:#ffffff;
  --ink:#16181b;
  --muted:#5d646c;
  --line:#dfe2dc;
  --accent:#ffd21f;
  --accent-ink:#16181b;
  --accent-soft:#fff3b8;
  --danger:#bf3a2b;
  --ok:#1f7a4d;
  --radius:10px;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Consolas,monospace;
}
html[lang="ar"],html[lang="ur"]{--display:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;--body:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif}
html[lang="bn"]{--display:'Noto Sans Bengali','Nirmala UI',sans-serif;--body:'Noto Sans Bengali','Nirmala UI',sans-serif}
html[lang="hi"]{--display:'Noto Sans Devanagari','Nirmala UI',sans-serif;--body:'Noto Sans Devanagari','Nirmala UI',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;unicode-bidi:isolate}

/* top bar */
.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto;min-width:0}
.brand-mark{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;flex:none}
.logo-tile{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;padding:4px;flex:none;overflow:hidden}
.logo-tile img{max-width:100%;max-height:100%;display:block}
.brand-name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;line-height:1.1}
.brand-sub{font-size:12px;color:#aab0b7;margin-top:2px}
.pill{display:flex;align-items:center;gap:8px;background:#262a2f;border-radius:8px;padding:0 12px;min-width:0}
.pill i{color:var(--accent)}
.pill input,.pill select{background:transparent;border:0;color:#fff;padding:10px 0;min-width:0}
.pill input{width:190px;max-width:100%}
.pill input::placeholder{color:#8b929a}
.pill select{cursor:pointer;color-scheme:dark;padding-inline-end:4px}
.pill select option{background:#262a2f;color:#fff}
.pill input:focus-visible,.pill select:focus-visible{outline:none}
.pill:focus-within{outline:3px solid var(--accent)}
.tabs{display:flex;gap:4px;width:100%;max-width:1180px;margin:0 auto;padding:0 16px;overflow-x:auto}
.tab{background:transparent;border:0;color:#aab0b7;padding:10px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab:not([aria-selected="true"]):hover{color:#fff}

/* page */
.page{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card h2{font-family:var(--display);font-size:19px;margin:0 0 14px}
.card h2 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px;margin-inline-start:8px}

/* form */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field label em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ok)}
.input{border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;min-width:0;width:100%;text-align:start}
.input:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.with-now{display:flex;gap:6px}
.with-now .input{flex:1}
.result{border:1.5px dashed var(--line);border-radius:8px;padding:8px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:44px}
.result strong{font-family:var(--mono);font-size:19px;font-weight:500}
.result small{color:var(--muted)}
.form-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.hint{margin:14px 0 0;color:var(--muted);font-size:13px;max-width:78ch}

.btn{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{background:#f4f4ef}
.btn-primary{background:var(--accent);border-color:var(--ink);color:var(--accent-ink)}
.btn-primary:hover{background:#ffdb4d}
.btn-quiet{border-color:var(--line);color:var(--muted)}
.btn-sm{padding:6px 10px;font-size:13px}
.btn-now{padding:0 11px;border-color:var(--line);color:var(--muted);white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn.del:hover{color:var(--danger);border-color:var(--danger)}

/* toolbar + table */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.toolbar .field{flex:0 1 auto}
.toolbar .grow{flex:1 1 220px}
.searchbox{position:relative}
.searchbox i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox .input{padding-inline-start:34px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:start;white-space:nowrap}
thead th{background:#f7f8f4;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);font-weight:700}
tbody td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcf8}
.th-btn{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.th-btn i{font-size:11px;opacity:.5}
.th-btn.on{color:var(--ink)}
.th-btn.on i{opacity:1}
.end{text-align:end}
.chip{display:inline-block;background:var(--accent-soft);border:1px solid #e9d26a;border-radius:99px;padding:2px 10px;font-family:var(--mono);font-size:13px;font-weight:500;unicode-bidi:isolate}
.actions{display:flex;gap:6px;justify-content:flex-end}
.tfoot-bar{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center;margin-top:14px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--mono);font-weight:500;unicode-bidi:isolate}
.pager{display:flex;align-items:center;gap:8px;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty i{font-size:30px;color:#c3c8bf}
.editing-note{background:var(--accent-soft);border:1px solid #e9d26a;border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-weight:600}

/* report */
.report-controls{display:grid;gap:12px}
.controls-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:#fff;border:0;padding:9px 14px;cursor:pointer;font-weight:600}
.seg button+button{border-inline-start:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:grid;gap:26px;min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.sheet-brand{display:flex;align-items:center;gap:12px}
.sheet-brand .logo-tile,.sheet-brand .brand-mark{width:56px;height:56px;background:#fff;border:1px solid var(--line)}
.sheet-brand .brand-mark{background:var(--accent)}
.sheet-title{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:.02em}
.sheet-sub{color:var(--muted);margin-top:4px}
.meta{display:grid;gap:3px;text-align:end}
.meta div{display:flex;gap:8px;justify-content:flex-end}
.meta span{color:var(--muted)}
.day{display:grid;gap:8px;break-inside:avoid}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.day-head h3{font-family:var(--display);font-size:17px;margin:0}
.day-head span{color:var(--muted);font-size:13px}
.day table th,.day table td{padding:7px 12px}
.totals{display:grid;grid-template-columns:repeat(var(--n,3),1fr);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.totals div{padding:8px 12px;display:grid;gap:2px;min-width:0}
.totals div+div{border-inline-start:1.5px solid var(--ink)}
.totals span{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
.totals strong{font-family:var(--mono);font-weight:500;font-size:15px;unicode-bidi:isolate}
.section-title{font-family:var(--display);font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";height:2px;background:var(--line);flex:1}
.sum-table tfoot td{font-weight:700;background:#f7f8f4;border-top:2px solid var(--ink)}
.sign{display:none}
.watermark{display:none}

@media (max-width:640px){
  .totals{grid-template-columns:1fr}
  .totals div+div{border-inline-start:0;border-top:1.5px solid var(--ink)}
  .meta,.meta div{text-align:start;justify-content:flex-start}
  .sheet{padding:18px}
  .pill input{width:140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  @page{size:A4;margin:12mm}
  body{background:transparent;font-size:12px}
  .no-print{display:none!important}
  .page{max-width:none;padding:0;gap:0}
  .sheet{background:transparent;border:0;border-radius:0;padding:0;gap:20px}
  .sheet-head{break-after:avoid}
  .day{break-inside:avoid}
  tr{break-inside:avoid}
  thead{display:table-header-group}
  .table-wrap{overflow:visible;border-color:#999}
  th,td{padding:5px 9px!important}
  thead th,.sum-table tfoot td{background:rgba(0,0,0,.07)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .brand-mark{background:var(--accent)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sign{display:flex;justify-content:space-between;margin-top:40px}
  .sign div{border-top:1px solid #333;padding-top:4px;width:200px;text-align:center;font-size:11px}
  /* RH logo watermark, repeated on every printed page */
  .watermark{display:block;position:fixed;top:50%;left:50%;width:62%;max-width:150mm;height:auto;transform:translate(-50%,-50%);opacity:.09;z-index:-1;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- v2: modals, login, SOP, roles, employees ---------- */
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2{margin:0}
.btn-add{padding:10px 16px}
.field.full{grid-column:1/-1}

.modal-back{position:fixed;inset:0;background:rgba(14,16,18,.55);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border:1.5px solid var(--ink);border-radius:14px;width:100%;max-width:540px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:10px}
.modal-head h2 i{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;flex:none}
.modal-body{padding:18px;overflow-y:auto;display:grid;gap:16px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;background:#f7f8f4;border-radius:0 0 13px 13px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sec-title{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:4px}
.sec-title:first-child{margin-top:0}
body.modal-open{overflow:hidden}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.calc div{padding:10px 12px;display:grid;gap:2px;min-width:0}
.calc div+div{border-inline-start:1.5px solid var(--ink)}
.calc span{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
.calc strong{font-family:var(--mono);font-weight:500;font-size:18px;unicode-bidi:isolate}
.calc .hot{background:var(--accent-soft)}
.calc .hot strong{font-size:24px}
.calc-note{font-size:13px;color:var(--muted);margin:0}
.calc-warn{font-size:13px;color:var(--danger);font-weight:600;margin:0}
.ro{background:#f4f4ef;color:var(--muted)}

.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#f4f4ef;white-space:nowrap}
.badge.admin{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge.supervisor{background:var(--accent);border-color:#cfa900;color:var(--accent-ink)}
.badge.user{background:#eef1ec}
.badge.ok{background:#e4f4ea;color:#14633b;border-color:#b8dfc7}
.badge.warn{background:#fff3d6;color:#8a5a00;border-color:#efd08a}
.badge.bad{background:#fbe5e1;color:var(--danger);border-color:#f0bdb5}
.sub{display:block;font-size:12px;color:var(--muted)}
.meter{height:6px;background:#ece9df;border-radius:99px;overflow:hidden;min-width:90px;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.over i{background:var(--danger)}

.userchip{display:flex;align-items:center;gap:10px;background:#262a2f;border-radius:8px;padding:4px 4px 4px 12px;padding-inline:12px 4px;min-width:0}
.userchip .who{display:grid;line-height:1.2;min-width:0}
.userchip .who b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.tb-btn{width:34px;height:34px;border-radius:7px;border:0;background:transparent;color:#cfd3d8;cursor:pointer;display:grid;place-items:center;flex:none}
.tb-btn:hover{background:#3a3f46;color:#fff}
.tb-btn:focus-visible{outline-color:var(--accent)}
.pill.light{background:#fff;border:1.5px solid var(--line)}
.pill.light i{color:var(--ink)}
.pill.light select{color:var(--ink);color-scheme:light}
.pill.light select option{background:#fff;color:var(--ink)}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.settings h3{margin:0 0 6px;font-family:var(--display);font-size:16px}
.settings p{margin:0 0 12px;color:var(--muted);font-size:13px;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row .field{flex:1 1 140px}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.login-side{background:var(--ink);color:#fff;padding:44px clamp(20px,4vw,60px);display:flex;flex-direction:column;gap:30px;position:relative;overflow:hidden}
.login-side::after{content:"";position:absolute;inset-inline-end:-140px;bottom:-140px;width:380px;height:380px;border-radius:50%;border:52px solid rgba(255,210,31,.07);pointer-events:none}
.login-brand{display:flex;align-items:center;gap:14px}
.login-brand .logo-tile,.login-brand .brand-mark{width:64px;height:64px;border-radius:14px}
.login-brand .brand-name{font-size:30px}
.login-side h2{font-family:var(--display);font-size:22px;margin:0}
.login-side .lead{margin:4px 0 0;color:#aab0b7;font-size:14px}
.sop-steps{list-style:none;margin:0;padding:0;display:grid}
.sop-step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.sop-step:last-child{padding-bottom:0}
.sop-step::before{content:"";position:absolute;inset-inline-start:21px;top:46px;bottom:2px;width:2px;background:rgba(255,255,255,.18)}
.sop-step:last-child::before{display:none}
.sop-ico{width:44px;height:44px;border-radius:12px;background:#262a2f;border:1.5px solid rgba(255,255,255,.22);color:var(--accent);display:grid;place-items:center;font-size:17px;position:relative}
.sop-ico b{position:absolute;inset-block-start:-7px;inset-inline-end:-7px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:500 11px var(--mono);display:grid;place-items:center}
.sop-step h3{margin:2px 0;font-family:var(--display);font-size:16px}
.sop-step p{margin:0;color:#aab0b7;font-size:13.5px;max-width:52ch}
.sop-light .sop-ico{background:var(--accent-soft);border-color:#e9d26a;color:var(--ink)}
.sop-light .sop-step::before{background:var(--line)}
.sop-light .sop-step p{color:var(--muted)}
.login-main{display:grid;align-content:center;justify-items:center;padding:72px 20px 32px;gap:18px;position:relative;background:var(--bg)}
.login-lang{position:absolute;inset-block-start:16px;inset-inline-end:16px}
.login-card{width:100%;max-width:420px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:26px;display:grid;gap:16px;box-shadow:8px 8px 0 var(--accent)}
[dir="rtl"] .login-card{box-shadow:-8px 8px 0 var(--accent)}
.login-card h1{margin:0;font-family:var(--display);font-size:28px;line-height:1.1}
.login-card .lead{margin:4px 0 0;color:var(--muted);font-size:14px}
.pwrap{position:relative}
.pwrap .input{padding-inline-end:46px}
.pwrap .icon-btn{position:absolute;inset-inline-end:5px;top:50%;transform:translateY(-50%);border:0;width:34px;height:34px}
.iwrap{position:relative}
.iwrap i.lead-ico{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.iwrap .input{padding-inline-start:36px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.err{background:#fbe5e1;border:1px solid #f0bdb5;color:var(--danger);border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.note{background:var(--accent-soft);border:1px solid #e9d26a;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note i{margin-top:3px}
.btn-block{width:100%;justify-content:center;padding:12px 14px;font-size:16px}
.role-list{display:grid;gap:10px;width:100%;max-width:420px}
.role-list h3{margin:0;font-family:var(--display);font-size:15px}
.role-item{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;align-items:start;font-size:13px;color:var(--muted)}
.sop-roles{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.sop-roles h3{margin:0;font-family:var(--display);font-size:16px}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-main{order:-1;padding-top:64px}
  .login-side{padding:28px 20px}
}
@media (max-width:520px){
  .mgrid{grid-template-columns:1fr}
  .modal-foot .btn{flex:1 1 auto;justify-content:center}
  .role-item{grid-template-columns:1fr}
  .userchip .who b{max-width:90px}
}
/* ---------- v3: bottom navigation, scan, more menu ---------- */
.bottomnav{display:none}
.scan-top{padding:9px 14px}
.scan-kind{display:flex;flex-wrap:wrap}
.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scan-btn{border:1.5px dashed var(--ink);background:var(--accent-soft);border-radius:12px;padding:18px 10px;cursor:pointer;display:grid;justify-items:center;gap:8px;font-weight:700}
.scan-btn i{font-size:26px}
.scan-btn:hover:not(:disabled){background:#ffeb85}
.scan-btn:disabled{opacity:.5;cursor:default}
.scan-preview{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);justify-self:center}
.scan-busy{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;padding:6px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-box{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ai-toggle{width:100%;background:#f7f8f4;border:0;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:700}
.ai-body{padding:14px;display:grid;gap:12px;border-top:1px solid var(--line)}
.ai-body p{margin:0;color:var(--muted);font-size:13px}
.err .detail{display:block;font-weight:400;font-size:12px;opacity:.85;word-break:break-word}
.menu{display:grid;gap:8px}
.menu-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-weight:600;cursor:pointer}
.menu-btn:hover{border-color:var(--ink)}
.menu-btn i{width:20px;text-align:center;color:var(--muted)}
.menu-btn.danger{color:var(--danger)}
.menu-btn.danger i{color:var(--danger)}
@media (max-width:720px){
  .tabs{display:none}
  .topbar-in .pill,.userchip,.scan-top{display:none}
  .page{padding-bottom:112px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;position:fixed;inset-inline:0;bottom:0;z-index:50;background:#fff;border-top:1.5px solid var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));padding-inline:max(4px,env(safe-area-inset-left,0px)) max(4px,env(safe-area-inset-right,0px))}
  .bn-item{background:none;border:0;display:grid;justify-items:center;gap:3px;padding:4px 2px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;min-width:0}
  .bn-item i{width:54px;height:30px;display:grid;place-items:center;border-radius:99px;font-size:18px}
  .bn-item span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bn-item[aria-current="page"]{color:var(--ink)}
  .bn-item[aria-current="page"] i{background:var(--accent)}
  .bn-item.bn-scan{color:var(--ink)}
  .bn-item.bn-scan i{width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--accent);font-size:23px;margin-top:-30px;border:4px solid #fff;box-shadow:0 0 0 1.5px var(--ink),0 8px 16px rgba(0,0,0,.25)}
  .bn-item.bn-scan span{margin-top:-2px}
}
@media (max-width:520px){
  .modal-back{align-items:end;padding:0}
  .modal{max-width:none;max-height:92vh;border-radius:16px 16px 0 0;border-inline-width:0;border-bottom-width:0}
  .modal-foot{border-radius:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .scan-actions{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media print{
  .login,.modal-back,.bottomnav{display:none!important}
}

/* ---------- date/time helpers (moment) ---------- */
// Keep Latin digits in every language; only month/day names and AM/PM are translated.
['ar-sa', 'bn', 'ur'].forEach((l) => moment.updateLocale(l, { postformat: (s) => s, preparse: (s) => s }));
moment.locale('en');
let MLOC = 'en';
const DATE_FMT = 'YYYY-MM-DD';
const mt = (s, f) => moment(s, f, 'en');                // parse (always English digits)
const fm = (m, f) => m.locale(MLOC).format(f);          // format in the active language
const today = () => moment().format(DATE_FMT);
const nowTime = () => moment().format('HH:mm');
const stamp = (date, time) => mt(`${date} ${time}`, `${DATE_FMT} HH:mm`);
const isWrap = (date, accept, delivery) => stamp(date, delivery).isBefore(stamp(date, accept));
const calcMinutes = (date, accept, delivery) => {
  const a = stamp(date, accept);
  const d = stamp(date, delivery);
  if (d.isBefore(a)) d.add(1, 'day'); // delivered after midnight
  return d.diff(a, 'minutes');
};
const fmtTime = (t) => fm(mt(t, 'HH:mm'), 'hh:mm A');
const fmtDate = (d) => fm(mt(d, DATE_FMT), 'DD MMM YYYY');
const fmtDay = (d) => fm(mt(d, DATE_FMT), 'dddd, DD MMM YYYY');
const fmtShortDay = (d) => fm(mt(d, DATE_FMT), 'ddd, DD MMM YYYY');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const durFormatter = (t) => (m) => {
  if (m === null || m === undefined || isNaN(m)) return '—';
  const v = Math.round(m * 10) / 10;
  const h = Math.floor(v / 60);
  const mm = Math.round((v - h * 60) * 10) / 10;
  return h > 0 ? `${h}${t('u.h')} ${mm}${t('u.m')}` : `${mm} ${t('u.min')}`;
};

/* ---------- order grouping ---------- */
const groupByDate = (rows) => {
  const map = {};
  rows.forEach((r) => { (map[r.date] = map[r.date] || []).push(r); });
  return Object.keys(map).sort().map((date) => {
    const items = map[date].slice().sort((a, b) => a.accept.localeCompare(b.accept));
    const mins = items.map((r) => r.minutes);
    const total = mins.reduce((s, m) => s + m, 0);
    return { date, items, count: items.length, total, avg: total / items.length, min: Math.min(...mins), max: Math.max(...mins) };
  });
};

/* ---------- fuel maths ---------- */
const vKey = (v) => (v || '').trim().toUpperCase();
const odoNum = (e) => parseInt(e.odo, 10);
const dtKey = (e) => `${e.date} ${e.time}`;

// Adds distance since the previous reading of the same vehicle, mileage (km/L) and cost to every entry.
const fuelStats = (entries) => {
  const sorted = entries.slice().sort((a, b) => dtKey(a).localeCompare(dtKey(b)) || a.createdAt - b.createdAt);
  const last = {};
  return sorted.map((e) => {
    const k = vKey(e.vehicle);
    const odo = odoNum(e);
    let distance = null, kmpl = null;
    if (last[k] !== undefined) {
      const d = odo - last[k];
      if (d >= 0) { distance = d; if (e.liters > 0) kmpl = d / e.liters; }
    }
    last[k] = odo;
    return { ...e, odoNum: odo, distance, kmpl, cost: e.amount !== undefined && e.amount !== null ? e.amount : (e.price > 0 ? e.liters * e.price : null) };
  });
};

const findPrev = (entries, f, excludeId) => {
  const k = vKey(f.vehicle);
  const at = `${f.date} ${f.time}`;
  let best = null;
  entries.forEach((e) => {
    if (e.id === excludeId || vKey(e.vehicle) !== k || dtKey(e) > at) return;
    if (!best || dtKey(e).localeCompare(dtKey(best)) > 0 || (dtKey(e) === dtKey(best) && e.createdAt > best.createdAt)) best = e;
  });
  return best ? { ...best, odoNum: odoNum(best) } : null;
};

const aggFuel = (items) => {
  let liters = 0, distance = 0, cost = 0, dv = 0, lv = 0;
  items.forEach((e) => {
    liters += e.liters;
    if (e.distance !== null) distance += e.distance;
    if (e.cost !== null) cost += e.cost;
    if (e.kmpl !== null) { dv += e.distance; lv += e.liters; }
  });
  return { fills: items.length, liters, distance, cost, kmpl: lv ? dv / lv : null };
};

const groupFuelByDate = (rows) => {
  const map = {};
  rows.forEach((r) => { (map[r.date] = map[r.date] || []).push(r); });
  return Object.keys(map).sort().map((date) => {
    const items = map[date].slice().sort((a, b) => a.time.localeCompare(b.time) || a.createdAt - b.createdAt);
    return { date, items, ...aggFuel(items) };
  });
};

const sha = async (text) => {
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* use the fallback below */ }
  return tinyHash(text);
};
const randSalt = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const hashPw = (pw, salt) => sha(`${salt}:${pw}`);
const checkPw = async (pw, u) => {
  const text = `${u.salt}:${pw}`;
  return u.hash === (await sha(text)) || u.hash === tinyHash(text);
};
const readSession = () => { try { return sessionStorage.getItem(LS_SESSION) || localStorage.getItem(LS_SESSION) || null; } catch (e) { return null; } };
const writeSession = (id, keep) => {
  try {
    sessionStorage.removeItem(LS_SESSION); localStorage.removeItem(LS_SESSION);
    if (id) (keep ? localStorage : sessionStorage).setItem(LS_SESSION, id);
  } catch (e) { /* storage blocked */ }
};
const nextEmpNo = (users) => 'EMP-' + String(users.reduce((m, u) => Math.max(m, parseInt(String(u.empNo).replace(/\D/g, ''), 10) || 0), 0) + 1).padStart(3, '0');
const iqamaState = (exp, t) => {
  if (!exp) return null;
  const days = mt(exp, DATE_FMT).diff(mt(today(), DATE_FMT), 'days');
  if (days < 0) return { cls: 'bad', text: t('emp.expired') };
  if (days <= 30) return { cls: 'warn', text: t('emp.soon', { n: days }) };
  return { cls: 'ok', text: t('emp.valid') };
};

function Modal({ title, icon, onClose, onSubmit, children, footer, wide }) {
  const { t } = useI18n();
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    document.body.classList.add('modal-open');
    const onKey = (e) => {
      if (Swal.isVisible()) return;
      if (e.key === 'Escape') { e.preventDefault(); onClose(); }
      if (e.key === 'Tab' && ref.current) {
        const els = ref.current.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled])');
        if (!els.length) return;
        const first = els[0], last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', onKey);
    const tm = setTimeout(() => {
      const el = ref.current && (ref.current.querySelector('[data-autofocus]') || ref.current.querySelector('input:not([disabled]),select:not([disabled])'));
      if (el) el.focus();
    }, 40);
    return () => { clearTimeout(tm); document.removeEventListener('keydown', onKey); document.body.classList.remove('modal-open'); if (prev && prev.focus) prev.focus(); };
  }, []);
  return (
    <div className="modal-back no-print">
      <form className={`modal${wide ? ' wide' : ''}`} ref={ref} role="dialog" aria-modal="true" aria-labelledby="modal-title" onSubmit={(e) => { e.preventDefault(); if (onSubmit) onSubmit(); }} noValidate>
        <div className="modal-head">
          <h2 id="modal-title">{icon && <Icon n={icon} />}{title}</h2>
          <button type="button" className="icon-btn" aria-label={t('btn.close')} onClick={onClose}><Icon n="xmark" /></button>
        </div>
        <div className="modal-body">{children}</div>
        <div className="modal-foot">{footer}</div>
      </form>
    </div>
  );
}

/* ---------- generic datatable: search, date range, sort, pagination ---------- */
function DataTable({ rows, columns, searchText, searchPh, defaultSort, dateFilter = true, renderStats, onDeleteAll }) {
  const { t } = useI18n();
  const [q, setQ] = useState('');
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [size, setSize] = useState(10);
  const [page, setPage] = useState(1);
  const [sort, setSort] = useState(defaultSort || { key: columns[0].k, dir: 'desc' });

  const filtered = useMemo(() => {
    const s = q.trim().toLowerCase();
    const out = rows.filter((r) => (!s || searchText(r).toLowerCase().includes(s)) && (!dateFilter || ((!from || r.date >= from) && (!to || r.date <= to))));
    out.sort((a, b) => {
      const av = a[sort.key], bv = b[sort.key];
      let c;
      if ((av === null || av === undefined) && (bv === null || bv === undefined)) c = 0;
      else if (av === null || av === undefined) c = -1;
      else if (bv === null || bv === undefined) c = 1;
      else if (typeof av === 'number' && typeof bv === 'number') c = av - bv;
      else c = String(av).localeCompare(String(bv), undefined, { numeric: true });
      if (c === 0) c = (a.createdAt || 0) - (b.createdAt || 0);
      return sort.dir === 'asc' ? c : -c;
    });
    return out;
  }, [rows, q, from, to, sort]);

  useEffect(() => { setPage(1); }, [q, from, to, size]);
  const pages = Math.max(1, Math.ceil(filtered.length / size));
  const cur = Math.min(page, pages);
  const start = (cur - 1) * size;
  const view = filtered.slice(start, start + size);
  const filtersOn = q || from || to;
  const sortBy = (k) => setSort((s) => ({ key: k, dir: s.key === k && s.dir === 'asc' ? 'desc' : 'asc' }));

  return (
    <>
      <div className="toolbar">
        <div className="field grow">
          <label htmlFor="dt-q">{t('tbl.search')}</label>
          <div className="searchbox"><Icon n="magnifying-glass" /><input id="dt-q" className="input" type="search" placeholder={searchPh} value={q} onChange={(e) => setQ(e.target.value)} /></div>
        </div>
        {dateFilter && (
          <>
            <div className="field"><label htmlFor="dt-from">{t('tbl.from')}</label><input id="dt-from" className="input" type="date" value={from} onChange={(e) => setFrom(e.target.value)} /></div>
            <div className="field"><label htmlFor="dt-to">{t('tbl.to')}</label><input id="dt-to" className="input" type="date" value={to} onChange={(e) => setTo(e.target.value)} /></div>
          </>
        )}
        <div className="field">
          <label htmlFor="dt-size">{t('tbl.rows')}</label>
          <select id="dt-size" className="input" value={size} onChange={(e) => setSize(Number(e.target.value))}>
            {[10, 25, 50, 100].map((n) => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
        {filtersOn && <button type="button" className="btn btn-quiet" onClick={() => { setQ(''); setFrom(''); setTo(''); }}><Icon n="circle-xmark" /> {t('tbl.clearFilters')}</button>}
        {onDeleteAll && <button type="button" className="btn btn-quiet" onClick={onDeleteAll}><Icon n="trash-can" /> {t('tbl.deleteAll')}</button>}
      </div>

      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th>{t('col.sl')}</th>
              {columns.map((c) => (c.sortable === false
                ? <th key={c.k} className={c.cls}>{c.label}</th>
                : (
                  <th key={c.k} className={c.cls} aria-sort={sort.key === c.k ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}>
                    <button type="button" className={`th-btn${sort.key === c.k ? ' on' : ''}`} onClick={() => sortBy(c.k)}>
                      {c.label}<Icon n={sort.key === c.k ? (sort.dir === 'asc' ? 'sort-up' : 'sort-down') : 'sort'} />
                    </button>
                  </th>
                )))}
            </tr>
          </thead>
          <tbody>
            {view.length === 0 && <tr><td colSpan={columns.length + 1} style={{ textAlign: 'center', color: 'var(--muted)', padding: 28 }}>{t('tbl.noMatch')}</td></tr>}
            {view.map((r, i) => (
              <tr key={r.id}>
                <td className="num">{start + i + 1}</td>
                {columns.map((c) => <td key={c.k} className={c.cls}>{c.cell(r)}</td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="tfoot-bar">
        {renderStats ? renderStats(filtered) : <div />}
        <div className="pager">
          <span className="num">{filtered.length ? t('pg.range', { a: start + 1, b: Math.min(start + size, filtered.length), c: filtered.length }) : '0'}</span>
          <button type="button" className="icon-btn" aria-label={t('pg.prev')} disabled={cur <= 1} onClick={() => setPage(cur - 1)}><Icon n="chevron-left" /></button>
          <span className="num">{t('pg.page', { c: cur, p: pages })}</span>
          <button type="button" className="icon-btn" aria-label={t('pg.next')} disabled={cur >= pages} onClick={() => setPage(cur + 1)}><Icon n="chevron-right" /></button>
        </div>
      </div>
    </>
  );
}

/* ---------- order modal ---------- */
function OrderModal({ editing, prefill, orders, users, me, lastEmp, onSave, onClose }) {
  const { t, dur } = useI18n();
  const isStaff = me.role !== 'user';
  const legacy = !!editing && !/^\d+$/.test(editing.orderId);
  const emps = users.filter((u) => u.active || (editing && u.id === editing.employeeId));
  const [f, setF] = useState(() => (editing
    ? { employeeId: editing.employeeId || '', date: editing.date, orderNo: editing.orderId, accept: editing.accept, delivery: editing.delivery }
    : { employeeId: isStaff ? lastEmp || '' : me.id, date: (prefill && prefill.date) || today(), orderNo: (prefill && prefill.orderNo) || '', accept: (prefill && prefill.accept) || '', delivery: (prefill && prefill.delivery) || '' }));
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const setNo = (e) => setF((p) => ({ ...p, orderNo: legacy ? e.target.value : e.target.value.replace(/\D/g, '').slice(0, 12) }));
  const now = (k) => () => setF((p) => ({ ...p, [k]: nowTime() }));

  const preview = useMemo(() => (f.date && f.accept && f.delivery
    ? { minutes: calcMinutes(f.date, f.accept, f.delivery), wraps: isWrap(f.date, f.accept, f.delivery) } : null), [f.date, f.accept, f.delivery]);

  async function submit(addNext) {
    const orderNo = f.orderNo.trim();
    if (!f.employeeId) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.pickEmp') }); return; }
    if (!f.date || !orderNo || !f.accept || !f.delivery) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.missingOrder') }); return; }
    if (!legacy && !/^\d{1,12}$/.test(orderNo)) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.orderNoBad') }); return; }
    const dup = orders.some((o) => (!editing || o.id !== editing.id) && o.date === f.date && String(o.orderId).toLowerCase() === orderNo.toLowerCase());
    if (dup) { Dlg.fire({ icon: 'error', title: t('w.dupTitle'), text: t('w.dupOrder', { id: orderNo, date: fmtDate(f.date) }) }); return; }
    if (isWrap(f.date, f.accept, f.delivery)) {
      const r = await Dlg.fire({ icon: 'question', title: t('w.wrapTitle'), text: t('w.wrapText'), showCancelButton: true, confirmButtonText: t('w.wrapYes'), cancelButtonText: t('w.wrapNo') });
      if (!r.isConfirmed) return;
    }
    onSave({ employeeId: f.employeeId, date: f.date, orderId: orderNo, accept: f.accept, delivery: f.delivery, minutes: calcMinutes(f.date, f.accept, f.delivery) }, editing ? editing.id : null);
    if (addNext) setF((p) => ({ ...p, orderNo: '', accept: '', delivery: '' }));
    else onClose();
  }

  return (
    <Modal title={editing ? t('ord.edit') : t('ord.add')} icon="bag-shopping" onClose={onClose} onSubmit={() => submit(false)}
      footer={(
        <>
          <button type="button" className="btn btn-quiet" onClick={onClose}>{t('w.cancel')}</button>
          {!editing && <button type="button" className="btn" onClick={() => submit(true)}><Icon n="plus" /> {t('btn.saveNext')}</button>}
          <button type="submit" className="btn btn-primary"><Icon n="floppy-disk" /> {editing ? t('btn.update') : t('btn.save')}</button>
        </>
      )}>
      <div className="mgrid">
        {prefill && <div className="note" style={{ gridColumn: '1 / -1' }}><Icon n="wand-magic-sparkles" /><span>{t('scan.review')}</span></div>}
        {isStaff && (
          <Field id="o-emp" label={t('f.employee')} full>
            <select id="o-emp" className="input" value={f.employeeId} onChange={set('employeeId')} {...af(!f.employeeId)}>
              <option value="">{t('f.pickEmp')}</option>
              {emps.map((u) => <option key={u.id} value={u.id}>{u.name} · {u.empNo}</option>)}
            </select>
          </Field>
        )}
        <Field id="o-date" label={<>{t('f.date')} <em>{t('f.auto')}</em></>}>
          <input id="o-date" className="input" type="date" value={f.date} onChange={set('date')} />
        </Field>
        <Field id="o-no" label={t('f.orderId')}>
          <input id="o-no" dir="ltr" className="input num" type="text" inputMode="numeric" autoComplete="off" placeholder={t('f.orderIdPh')} value={f.orderNo} onChange={setNo} {...af(!!f.employeeId)} />
        </Field>
        <Field id="o-accept" label={t('f.accept')}>
          <div className="with-now">
            <input id="o-accept" dir="ltr" className="input num" type="time" value={f.accept} onChange={set('accept')} />
            <button type="button" className="btn btn-now" title={t('f.nowTip')} onClick={now('accept')}><Icon n="clock" /> {t('f.now')}</button>
          </div>
        </Field>
        <Field id="o-delivery" label={t('f.delivery')}>
          <div className="with-now">
            <input id="o-delivery" dir="ltr" className="input num" type="time" value={f.delivery} onChange={set('delivery')} />
            <button type="button" className="btn btn-now" title={t('f.nowTip')} onClick={now('delivery')}><Icon n="clock" /> {t('f.now')}</button>
          </div>
        </Field>
      </div>
      <div className="calc" aria-live="polite">
        <div className="hot"><span>{t('f.take')}</span><strong>{preview ? dur(preview.minutes) : '—'}</strong></div>
        <div><span>{t('f.a2d')}</span><strong>{preview && preview.wraps ? t('f.nextDay') : '—'}</strong></div>
      </div>
    </Modal>
  );
}

/* ---------- orders tab ---------- */
function OrdersTab({ orders, setOrders, users, me, scanned, onScanUsed }) {
  const { t, dur } = useI18n();
  const isStaff = me.role !== 'user';
  const isAdmin = me.role === 'admin';
  const [modal, setModal] = useState(null);
  const [lastEmp, setLastEmp] = useState('');
  const nameOf = (id) => { const u = users.find((x) => x.id === id); return u ? u.name : '—'; };
  useEffect(() => {
    if (scanned && scanned.kind === 'order') { setModal({ editing: null, prefill: scanned.data }); onScanUsed(); }
  }, [scanned]);
  const mine = useMemo(() => (isStaff ? orders : orders.filter((o) => o.employeeId === me.id)), [orders, isStaff, me.id]);
  const rows = useMemo(() => mine.map((o) => ({ ...o, empName: nameOf(o.employeeId) })), [mine, users]);

  function save(entry, id) {
    if (id) { setOrders((l) => l.map((o) => (o.id === id ? { ...o, ...entry } : o))); Toast.fire({ icon: 'success', title: t('toast.updated') }); }
    else { setOrders((l) => [...l, { id: uid(), createdAt: Date.now(), ...entry }]); Toast.fire({ icon: 'success', title: t('toast.orderSaved', { id: entry.orderId }) }); }
    if (isStaff) setLastEmp(entry.employeeId);
  }
  async function remove(o) {
    if (!(await confirmDelete(t, t('w.delOrderTitle', { id: o.orderId }), `${fmtDate(o.date)} · ${fmtTime(o.accept)} - ${fmtTime(o.delivery)}`))) return;
    setOrders((l) => l.filter((x) => x.id !== o.id));
    Toast.fire({ icon: 'success', title: t('toast.deleted') });
  }
  async function clearAll() {
    if (!(await confirmDeleteAll(t, t('x.orders'), orders.length))) return;
    setOrders([]);
    Toast.fire({ icon: 'success', title: t('toast.allDeleted') });
  }

  const columns = [
    { k: 'date', label: t('col.date'), cell: (o) => fmtDate(o.date) },
    { k: 'orderId', label: t('col.orderId'), cell: (o) => <span className="num">{o.orderId}</span> },
    ...(isStaff ? [{ k: 'empName', label: t('col.employee'), cell: (o) => o.empName }] : []),
    { k: 'accept', label: t('col.accept'), cell: (o) => <span className="num">{fmtTime(o.accept)}</span> },
    { k: 'delivery', label: t('col.delivery'), cell: (o) => <span className="num">{fmtTime(o.delivery)}</span> },
    { k: 'minutes', label: t('col.take'), cell: (o) => <span className="chip">{dur(o.minutes)}</span> },
    ...(isStaff ? [{ k: '_a', label: t('col.actions'), sortable: false, cls: 'end', cell: (o) => <RowActions editLabel={t('aria.editOrder', { id: o.orderId })} delLabel={t('aria.delOrder', { id: o.orderId })} onEdit={() => setModal({ editing: o })} onDelete={() => remove(o)} /> }] : [])
  ];

  return (
    <>
      <section className="card" aria-labelledby="ord-h">
        <div className="card-head">
          <h2 id="ord-h">{t('ord.title')}<small>{t('n.saved', { n: mine.length })}</small></h2>
          <button type="button" className="btn btn-primary btn-add" onClick={() => setModal({ editing: null })}><Icon n="plus" /> {t('ord.add')}</button>
        </div>
        {mine.length === 0 ? (
          <div className="empty"><Icon n="table-list" /><div>{t('empty.orders')}</div></div>
        ) : (
          <DataTable rows={rows} columns={columns} defaultSort={{ key: 'date', dir: 'desc' }}
            searchText={(o) => `${o.orderId} ${fmtDate(o.date)} ${o.empName}`} searchPh={t('tbl.orderSearchPh')}
            onDeleteAll={isAdmin ? clearAll : null}
            renderStats={(list) => {
              const total = list.reduce((s, o) => s + o.minutes, 0);
              return <div className="stats"><Stat label={t('st.orders')} value={list.length} /><Stat label={t('st.totalTime')} value={dur(total)} /><Stat label={t('st.average')} value={list.length ? dur(total / list.length) : '—'} /></div>;
            }} />
        )}
      </section>
      {modal && <OrderModal editing={modal.editing} prefill={modal.prefill} orders={orders} users={users} me={me} lastEmp={lastEmp} onSave={save} onClose={() => setModal(null)} />}
    </>
  );
}

/* ---------- fuel modal: amount paid becomes liters at the set price ---------- */
function FuelModal({ editing, prefill, fuel, users, me, price, lastEmp, onSave, onClose }) {
  const { t } = useI18n();
  const isStaff = me.role !== 'user';
  const emps = users.filter((u) => u.active || (editing && u.id === editing.employeeId));
  const [f, setF] = useState(() => (editing
    ? { employeeId: editing.employeeId || '', date: editing.date, time: editing.time, odo: editing.odo, amount: String(entryAmount(editing)) }
    : { employeeId: isStaff ? lastEmp || '' : me.id, date: (prefill && prefill.date) || today(), time: (prefill && prefill.time) || nowTime(), odo: (prefill && prefill.odo) || '', amount: prefill ? (prefill.amount ? String(prefill.amount) : (prefill.liters && Number(price) > 0 ? String(r2(prefill.liters * Number(price))) : '')) : '' }));
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const emp = users.find((u) => u.id === f.employeeId);
  const plate = (emp && emp.plate) || (editing && editing.vehicle) || '';
  const usedPrice = editing && editing.price > 0 ? editing.price : Number(price);
  const amountNum = parseFloat(f.amount);
  const liters = amountNum > 0 && usedPrice > 0 ? r2(amountNum / usedPrice) : null;
  const odoOk = /^\d{1,9}$/.test(f.odo);

  const prev = useMemo(() => (odoOk && plate ? findPrev(fuel, { vehicle: plate, date: f.date, time: f.time }, editing ? editing.id : null) : null), [fuel, plate, f.date, f.time, f.odo]);
  const distance = prev && odoOk && parseInt(f.odo, 10) >= prev.odoNum ? parseInt(f.odo, 10) - prev.odoNum : null;
  const kmpl = distance !== null && liters ? distance / liters : null;
  const month = f.date.slice(0, 7);
  const usedMonth = emp ? fuel.filter((e) => e.employeeId === emp.id && e.date.slice(0, 7) === month && (!editing || e.id !== editing.id)).reduce((s, e) => s + entryAmount(e), 0) : 0;
  const limit = emp && emp.allowance > 0 ? emp.allowance : 0;
  const after = usedMonth + (amountNum > 0 ? amountNum : 0);
  const over = limit > 0 && after > limit;

  async function submit(addNext) {
    if (!f.employeeId) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.pickEmp') }); return; }
    if (!plate) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.noPlateFuel') }); return; }
    if (!f.date || !f.time || !f.odo || !f.amount) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.fuelMissing') }); return; }
    if (!odoOk) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.odoBad') }); return; }
    if (!(amountNum > 0)) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.amountBad') }); return; }
    if (!(usedPrice > 0)) { Dlg.fire({ icon: 'warning', title: t('w.missingTitle'), text: t('w.noPrice') }); return; }
    const odoVal = parseInt(f.odo, 10);
    if (fuel.some((e) => (!editing || e.id !== editing.id) && vKey(e.vehicle) === vKey(plate) && odoNum(e) === odoVal)) { Dlg.fire({ icon: 'error', title: t('w.dupTitle'), text: t('w.odoDup') }); return; }
    if (prev && odoVal < prev.odoNum) {
      const r = await Dlg.fire({ icon: 'question', title: t('w.odoLowTitle'), text: t('w.odoLowText', { prev: prev.odo, odo: f.odo }), showCancelButton: true, confirmButtonText: t('w.odoLowYes'), cancelButtonText: t('w.odoLowNo') });
      if (!r.isConfirmed) return;
    }
    if (over) {
      const r = await Dlg.fire({ icon: 'warning', title: t('emp.fuelMonth'), text: t('w.overAllow', { name: emp.name, used: n2(after), limit: n2(limit) }), showCancelButton: true, confirmButtonText: t('w.overYes'), cancelButtonText: t('w.cancel') });
      if (!r.isConfirmed) return;
    }
    onSave({ employeeId: f.employeeId, date: f.date, time: f.time, vehicle: plate, odo: f.odo, amount: r2(amountNum), price: usedPrice, liters }, editing ? editing.id : null);
    if (addNext) setF((p) => ({ ...p, time: nowTime(), odo: '', amount: '' }));
    else onClose();
  }

  return (
    <Modal title={editing ? t('fuel.edit') : t('fuel.add')} icon="gas-pump" onClose={onClose} onSubmit={() => submit(false)}
      footer={(
        <>
          <button type="button" className="btn btn-quiet" onClick={onClose}>{t('w.cancel')}</button>
          {!editing && <button type="button" className="btn" onClick={() => submit(true)}><Icon n="plus" /> {t('btn.saveNext')}</button>}
          <button type="submit" className="btn btn-primary"><Icon n="floppy-disk" /> {editing ? t('fuel.update') : t('fuel.save')}</button>
        </>
      )}>
      <div className="mgrid">
        {prefill && <div className="note" style={{ gridColumn: '1 / -1' }}><Icon n="wand-magic-sparkles" /><span>{t('scan.review')}</span></div>}
        {isStaff && (
          <Field id="g-emp" label={t('f.employee')}>
            <select id="g-emp" className="input" value={f.employeeId} onChange={set('employeeId')} {...af(!f.employeeId)}>
              <option value="">{t('f.pickEmp')}</option>
              {emps.map((u) => <option key={u.id} value={u.id}>{u.name} · {u.empNo}</option>)}
            </select>
          </Field>
        )}
        <Field id="g-plate" label={t('f.plate')} full={!isStaff}>
          <input id="g-plate" dir="ltr" className="input num ro" type="text" readOnly value={plate || t('f.noPlate')} />
        </Field>
        <Field id="g-date" label={<>{t('f.date')} <em>{t('f.auto')}</em></>}>
          <input id="g-date" className="input" type="date" value={f.date} onChange={set('date')} />
        </Field>
        <Field id="g-time" label={t('f.time')}>
          <div className="with-now">
            <input id="g-time" dir="ltr" className="input num" type="time" value={f.time} onChange={set('time')} />
            <button type="button" className="btn btn-now" title={t('f.nowTip')} onClick={() => setF((p) => ({ ...p, time: nowTime() }))}><Icon n="clock" /> {t('f.now')}</button>
          </div>
        </Field>
        <Field id="g-odo" label={t('f.odo')}>
          <input id="g-odo" dir="ltr" className="input num" type="text" inputMode="numeric" autoComplete="off" placeholder={t('f.odoPh')} value={f.odo} onChange={(e) => setF((p) => ({ ...p, odo: e.target.value.replace(/\D/g, '').slice(0, 9) }))} {...af(!!f.employeeId)} />
        </Field>
        <Field id="g-amount" label={t('f.amount')}>
          <input id="g-amount" dir="ltr" className="input num" type="text" inputMode="decimal" autoComplete="off" placeholder={t('f.amountPh')} value={f.amount} onChange={(e) => { const v = e.target.value; if (/^\d{0,5}(\.\d{0,2})?$/.test(v)) setF((p) => ({ ...p, amount: v })); }} />
        </Field>
      </div>
      <div className="calc" aria-live="polite">
        <div><span>{t('f.priceL')}</span><strong>{usedPrice > 0 ? n2(usedPrice) : '—'}</strong></div>
        <div className="hot"><span>{t('f.litersAuto')}</span><strong>{liters !== null ? n2(liters) : '—'}</strong></div>
        <div><span>{t('f.distance')}</span><strong>{distance !== null ? `${nKm(distance)} ${t('u.km')}` : '—'}</strong></div>
        <div><span>{t('f.kmpl')}</span><strong>{kmpl !== null ? n2(kmpl) : '—'}</strong></div>
      </div>
      <p className="calc-note">{plate ? (prev ? t('fuel.prevNote', { odo: prev.odo }) : t('fuel.firstNote')) : ''}</p>
      {over && <p className="calc-warn"><Icon n="triangle-exclamation" /> {t('w.overAllow', { name: emp.name, used: n2(after), limit: n2(limit) })}</p>}
    </Modal>
  );
}

/* ---------- fuel tab ---------- */
function FuelTab({ fuel, setFuel, users, me, price, scanned, onScanUsed }) {
  const { t } = useI18n();
  const isStaff = me.role !== 'user';
  const isAdmin = me.role === 'admin';
  const [modal, setModal] = useState(null);
  const [lastEmp, setLastEmp] = useState('');
  const nameOf = (id) => { const u = users.find((x) => x.id === id); return u ? u.name : '—'; };
  useEffect(() => {
    if (scanned && scanned.kind === 'fuel') { setModal({ editing: null, prefill: scanned.data }); onScanUsed(); }
  }, [scanned]);
  const all = useMemo(() => fuelStats(fuel), [fuel]);
  const mine = useMemo(() => (isStaff ? all : all.filter((e) => e.employeeId === me.id)), [all, isStaff, me.id]);
  const rows = useMemo(() => mine.map((e) => ({ ...e, empName: nameOf(e.employeeId), litersN: e.liters, amountN: entryAmount(e) })), [mine, users]);

  function save(entry, id) {
    if (id) { setFuel((l) => l.map((e) => (e.id === id ? { ...e, ...entry } : e))); Toast.fire({ icon: 'success', title: t('toast.updated') }); }
    else { setFuel((l) => [...l, { id: uid(), createdAt: Date.now(), ...entry }]); Toast.fire({ icon: 'success', title: t('toast.fuelSaved') }); }
    if (isStaff) setLastEmp(entry.employeeId);
  }
  async function remove(e) {
    if (!(await confirmDelete(t, t('w.delFuelTitle'), `${fmtDate(e.date)} · ${fmtTime(e.time)} · ${e.odo} ${t('u.km')}`))) return;
    setFuel((l) => l.filter((x) => x.id !== e.id));
    Toast.fire({ icon: 'success', title: t('toast.deleted') });
  }
  async function clearAll() {
    if (!(await confirmDeleteAll(t, t('x.fuel'), fuel.length))) return;
    setFuel([]);
    Toast.fire({ icon: 'success', title: t('toast.allDeleted') });
  }

  const columns = [
    { k: 'date', label: t('col.date'), cell: (e) => fmtDate(e.date) },
    { k: 'time', label: t('col.time'), cell: (e) => <span className="num">{fmtTime(e.time)}</span> },
    ...(isStaff ? [{ k: 'empName', label: t('col.employee'), cell: (e) => e.empName }] : []),
    { k: 'vehicle', label: t('col.plate'), cell: (e) => <span className="num">{e.vehicle || '—'}</span> },
    { k: 'odoNum', label: t('col.odo'), cell: (e) => <span className="num">{e.odo}</span> },
    { k: 'litersN', label: t('col.liters'), cell: (e) => <span className="num">{n2(e.liters)}</span> },
    { k: 'amountN', label: t('col.amount'), cell: (e) => <span className="num">{n2(e.amountN)}</span> },
    { k: 'distance', label: t('col.distance'), cell: (e) => <span className="num">{nKm(e.distance)}</span> },
    { k: 'kmpl', label: t('col.kmpl'), cell: (e) => (e.kmpl === null ? '—' : <span className="chip">{n2(e.kmpl)}</span>) },
    ...(isStaff ? [{ k: '_a', label: t('col.actions'), sortable: false, cls: 'end', cell: (e) => <RowActions editLabel={t('aria.editEntry')} delLabel={t('aria.delEntry')} onEdit={() => setModal({ editing: e })} onDelete={() => remove(e)} /> }] : [])
  ];

  return (
    <>
      <section className="card" aria-labelledby="fuel-h">
        <div className="card-head">
          <h2 id="fuel-h">{t('fuel.title')}<small>{t('n.saved', { n: mine.length })}</small></h2>
          <button type="button" className="btn btn-primary btn-add" onClick={() => setModal({ editing: null })}><Icon n="plus" /> {t('fuel.add')}</button>
        </div>
        {mine.length === 0 ? (
          <div className="empty"><Icon n="gas-pump" /><div>{t('empty.fuel')}</div></div>
        ) : (
          <DataTable rows={rows} columns={columns} defaultSort={{ key: 'date', dir: 'desc' }}
            searchText={(e) => `${e.vehicle} ${e.odo} ${fmtDate(e.date)} ${e.empName}`} searchPh={t('fuel.searchPh')}
            onDeleteAll={isAdmin ? clearAll : null}
            renderStats={(list) => {
              const a = aggFuel(list);
              return <div className="stats"><Stat label={t('st.fills')} value={a.fills} /><Stat label={t('st.liters')} value={n2(a.liters)} /><Stat label={t('st.cost')} value={`${n2(a.cost)} ${CURRENCY}`} /><Stat label={t('st.distance')} value={`${nKm(a.distance)} ${t('u.km')}`} /><Stat label={t('st.kmpl')} value={n2(a.kmpl)} /></div>;
            }} />
        )}
      </section>
      {modal && <FuelModal editing={modal.editing} prefill={modal.prefill} fuel={fuel} users={users} me={me} price={price} lastEmp={lastEmp} onSave={save} onClose={() => setModal(null)} />}
    </>
  );
}

/* ---------- employee modal ---------- */
function EmployeeModal({ editing, users, me, onSave, onClose }) {
  const { t } = useI18n();
  const [f, setF] = useState(() => (editing
    ? { name: editing.name, role: editing.role, username: editing.username, password: '', iqama: editing.iqama || '', iqamaExp: editing.iqamaExp || '', nation: editing.nation || '', phone: editing.phone || '', plate: editing.plate || '', vtype: editing.vtype || 'motorcycle', allowance: String(editing.allowance || 0), active: editing.active ? 'yes' : 'no' }
    : { name: '', role: 'user', username: '', password: '', iqama: '', iqamaExp: '', nation: '', phone: '', plate: '', vtype: 'motorcycle', allowance: '0', active: 'yes' }));
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
  const digits = (k, n) => (e) => setF((p) => ({ ...p, [k]: e.target.value.replace(/\D/g, '').slice(0, n) }));
  const warn = (text, title) => Dlg.fire({ icon: 'warning', title: title || t('w.missingTitle'), text });

  function submit() {
    const username = f.username.trim();
    if (!f.name.trim()) return warn(t('w.empName'));
    if (f.iqama && !/^\d{10}$/.test(f.iqama)) return warn(t('w.iqamaBad'));
    if (f.iqama && users.some((u) => u.id !== (editing && editing.id) && u.iqama === f.iqama)) return warn(t('w.iqamaDup'));
    if (!/^[A-Za-z0-9._-]{3,20}$/.test(username)) return warn(t('w.userBad'));
    if (users.some((u) => u.id !== (editing && editing.id) && u.username.toLowerCase() === username.toLowerCase())) return warn(t('w.userDup'));
    if ((!editing || f.password) && f.password.length < 6) return warn(t('w.passBad'));
    if (editing && editing.role === 'admin' && (f.role !== 'admin' || f.active === 'no')) {
      const others = users.filter((u) => u.id !== editing.id && u.role === 'admin' && u.active);
      if (!others.length) return warn(t('w.lastAdmin'));
    }
    const allowance = Number(f.allowance);
    onSave({ ...f, username, allowance: allowance > 0 ? allowance : 0 }, editing);
  }

  return (
    <Modal title={editing ? t('emp.edit') : t('emp.add')} icon="user-plus" wide onClose={onClose} onSubmit={submit}
      footer={(
        <>
          <button type="button" className="btn btn-quiet" onClick={onClose}>{t('w.cancel')}</button>
          <button type="submit" className="btn btn-primary"><Icon n="floppy-disk" /> {t('btn.saveGeneric')}</button>
        </>
      )}>
      <div className="mgrid">
        <div className="sec-title">{t('emp.sec1')}</div>
        <Field id="e-name" label={t('emp.name')} full><input id="e-name" className="input" type="text" autoComplete="off" value={f.name} onChange={set('name')} data-autofocus="" /></Field>
        <Field id="e-iqama" label={t('emp.iqama')}><input id="e-iqama" dir="ltr" className="input num" type="text" inputMode="numeric" autoComplete="off" placeholder="2xxxxxxxxx" value={f.iqama} onChange={digits('iqama', 10)} /></Field>
        <Field id="e-iexp" label={t('emp.iqamaExp')}><input id="e-iexp" className="input" type="date" value={f.iqamaExp} onChange={set('iqamaExp')} /></Field>
        <Field id="e-nat" label={t('emp.nation')}><input id="e-nat" className="input" type="text" autoComplete="off" value={f.nation} onChange={set('nation')} /></Field>
        <Field id="e-phone" label={t('emp.phone')}><input id="e-phone" dir="ltr" className="input num" type="tel" autoComplete="off" placeholder="05xxxxxxxx" value={f.phone} onChange={(e) => setF((p) => ({ ...p, phone: e.target.value.replace(/[^\d+]/g, '').slice(0, 15) }))} /></Field>

        <div className="sec-title">{t('emp.sec2')}</div>
        <Field id="e-plate" label={t('emp.plate')}><input id="e-plate" dir="ltr" className="input num" type="text" autoComplete="off" placeholder="ABC 1234" value={f.plate} onChange={(e) => setF((p) => ({ ...p, plate: e.target.value.toUpperCase().slice(0, 12) }))} /></Field>
        <Field id="e-vtype" label={t('emp.vtype')}>
          <select id="e-vtype" className="input" value={f.vtype} onChange={set('vtype')}>{VTYPES.map(([v, k]) => <option key={v} value={v}>{t(k)}</option>)}</select>
        </Field>
        <Field id="e-allow" label={t('emp.allow')} full hint={<span className="sub">{t('emp.allowHint')}</span>}>
          <input id="e-allow" dir="ltr" className="input num" type="text" inputMode="decimal" value={f.allowance} onChange={(e) => { const v = e.target.value; if (/^\d{0,6}(\.\d{0,2})?$/.test(v)) setF((p) => ({ ...p, allowance: v })); }} />
        </Field>

        <div className="sec-title">{t('emp.sec3')}</div>
        <Field id="e-role" label={t('emp.role')}>
          <select id="e-role" className="input" value={f.role} onChange={set('role')}>{ROLES.map((r) => <option key={r} value={r}>{t('role.' + r)}</option>)}</select>
        </Field>
        <Field id="e-status" label={t('emp.status')}>
          <select id="e-status" className="input" value={f.active} onChange={set('active')}><option value="yes">{t('emp.active')}</option><option value="no">{t('emp.inactive')}</option></select>
        </Field>
        <Field id="e-user" label={t('emp.username')}><input id="e-user" dir="ltr" className="input num" type="text" autoComplete="off" autoCapitalize="none" value={f.username} onChange={set('username')} /></Field>
        <Field id="e-pass" label={t('emp.password')} hint={editing ? <span className="sub">{t('emp.passKeep')}</span> : null}><input id="e-pass" dir="ltr" className="input" type="text" autoComplete="new-password" value={f.password} onChange={set('password')} /></Field>
      </div>
    </Modal>
  );
}

/* ---------- employees tab (Admin edits, Supervisor views) ---------- */
function EmployeesTab({ users, setUsers, fuel, me, price, setPrice, restoreAll, backupData }) {
  const { t } = useI18n();
  const isAdmin = me.role === 'admin';
  const [modal, setModal] = useState(null);
  const [priceIn, setPriceIn] = useState(String(price));
  const fileRef = useRef(null);
  const month = today().slice(0, 7);
  const rows = useMemo(() => users.map((u) => ({
    ...u,
    used: fuel.filter((e) => e.employeeId === u.id && e.date.slice(0, 7) === month).reduce((s, e) => s + entryAmount(e), 0)
  })), [users, fuel, month]);

  function savePrice() {
    const p = parseFloat(priceIn);
    if (!(p > 0)) { Dlg.fire({ icon: 'warning', text: t('w.priceBad') }); return; }
    setPrice(String(p));
    Toast.fire({ icon: 'success', title: t('toast.priceSaved') });
  }

  async function saveEmployee(f, editing) {
    const fields = { name: f.name.trim(), role: f.role, username: f.username, iqama: f.iqama, iqamaExp: f.iqamaExp, nation: f.nation.trim(), phone: f.phone, plate: f.plate.trim(), vtype: f.vtype, allowance: f.allowance, active: f.active === 'yes' };
    if (editing) {
      const next = { ...editing, ...fields };
      if (f.password) { const salt = randSalt(); next.salt = salt; next.hash = await hashPw(f.password, salt); next.defaultPw = false; }
      setUsers((l) => l.map((u) => (u.id === editing.id ? next : u)));
    } else {
      const salt = randSalt();
      const next = { id: uid(), createdAt: Date.now(), empNo: nextEmpNo(users), joined: today(), defaultPw: false, ...fields, salt, hash: await hashPw(f.password, salt) };
      setUsers((l) => [...l, next]);
    }
    setModal(null);
    Toast.fire({ icon: 'success', title: t('toast.empSaved') });
  }

  async function remove(u) {
    if (u.id === me.id) { Dlg.fire({ icon: 'warning', text: t('w.selfDel') }); return; }
    if (u.role === 'admin' && !users.some((x) => x.id !== u.id && x.role === 'admin' && x.active)) { Dlg.fire({ icon: 'warning', text: t('w.lastAdmin') }); return; }
    if (!(await confirmDelete(t, t('w.delEmpTitle', { name: u.name }), t('w.delEmpText')))) return;
    setUsers((l) => l.filter((x) => x.id !== u.id));
    Toast.fire({ icon: 'success', title: t('toast.empDeleted') });
  }

  function download() {
    const blob = new Blob([JSON.stringify(backupData())], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `keeta-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  function onFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const rd = new FileReader();
    rd.onload = async () => {
      let d = null;
      try { d = JSON.parse(rd.result); } catch (err) { d = null; }
      if (!d || d.app !== 'keeta' || !Array.isArray(d.orders) || !Array.isArray(d.fuel) || !Array.isArray(d.users) || !d.users.some((u) => u.role === 'admin' && u.active)) {
        Dlg.fire({ icon: 'error', text: t('w.restoreBad') }); return;
      }
      const r = await Dlg.fire({ icon: 'warning', title: t('w.restoreTitle'), text: t('w.restoreText'), showCancelButton: true, confirmButtonText: t('w.restoreYes'), cancelButtonText: t('w.cancel') });
      if (!r.isConfirmed) return;
      restoreAll(d);
      Toast.fire({ icon: 'success', title: t('toast.restored') });
    };
    rd.readAsText(file);
  }

  const columns = [
    { k: 'empNo', label: t('emp.no'), cell: (u) => <span className="num">{u.empNo}</span> },
    { k: 'name', label: t('emp.name'), cell: (u) => <>{u.name}<span className="sub num" dir="ltr">@{u.username}</span></> },
    { k: 'role', label: t('emp.role'), cell: (u) => <RoleBadge role={u.role} /> },
    { k: 'iqama', label: t('emp.iqama'), cell: (u) => {
      const s = iqamaState(u.iqamaExp, t);
      return <>{u.iqama ? <span className="num">{u.iqama}</span> : '—'}{s && <span className="sub"><span className={`badge ${s.cls}`}>{s.text}</span></span>}</>;
    } },
    { k: 'plate', label: t('emp.plate'), cell: (u) => <>{u.plate ? <span className="num">{u.plate}</span> : '—'}{u.plate && <span className="sub">{t((VTYPES.find((v) => v[0] === u.vtype) || VTYPES[0])[1])}</span>}</> },
    { k: 'phone', label: t('emp.phone'), cell: (u) => <span className="num" dir="ltr">{u.phone || '—'}</span> },
    { k: 'used', label: t('emp.fuelMonth'), cell: (u) => {
      const pct = u.allowance > 0 ? Math.min(100, (u.used / u.allowance) * 100) : 0;
      return <><span className="num">{n2(u.used)}{u.allowance > 0 ? ` / ${n2(u.allowance)}` : ''}</span>{u.allowance > 0 && <div className={`meter${u.used > u.allowance ? ' over' : ''}`}><i style={{ width: `${pct}%` }} /></div>}</>;
    } },
    { k: 'active', label: t('emp.status'), cell: (u) => <span className={`badge ${u.active ? 'ok' : 'bad'}`}>{u.active ? t('emp.active') : t('emp.inactive')}</span> },
    ...(isAdmin ? [{ k: '_a', label: t('col.actions'), sortable: false, cls: 'end', cell: (u) => <RowActions editLabel={`${t('act.edit')} ${u.name}`} delLabel={`${t('act.delete')} ${u.name}`} onEdit={() => setModal({ editing: u })} onDelete={() => remove(u)} /> }] : [])
  ];

  return (
    <>
      {isAdmin && (
        <section className="card" aria-labelledby="set-h">
          <div className="card-head"><h2 id="set-h">{t('set.title')}</h2></div>
          <div className="settings">
            <div>
              <h3>{t('set.price')}</h3>
              <p>{t('set.priceHelp')}</p>
              <div className="row">
                <div className="field"><label htmlFor="s-price">{t('f.priceL')}</label><input id="s-price" dir="ltr" className="input num" type="text" inputMode="decimal" value={priceIn} onChange={(e) => { const v = e.target.value; if (/^\d{0,3}(\.\d{0,3})?$/.test(v)) setPriceIn(v); }} /></div>
                <button type="button" className="btn btn-primary" onClick={savePrice}><Icon n="floppy-disk" /> {t('set.save')}</button>
              </div>
            </div>
            <div>
              <h3>{t('set.dataTitle')}</h3>
              <p>{t('set.dataHelp')}</p>
              <div className="row">
                <button type="button" className="btn" onClick={download}><Icon n="download" /> {t('set.backup')}</button>
                <button type="button" className="btn" onClick={() => fileRef.current && fileRef.current.click()}><Icon n="upload" /> {t('set.restore')}</button>
                <input ref={fileRef} type="file" accept="application/json,.json" hidden onChange={onFile} />
              </div>
            </div>
            <AiSettings />
