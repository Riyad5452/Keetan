/* ---------- scan a picture with Gemini or OpenAI ---------- */
const LS_AI = 'keeta_ai_v1';
const AI_DEFAULTS = { gemini: 'gemini-2.5-flash', openai: 'gpt-4o-mini' };
// OPTIONAL: paste the key here ONCE and it works on every phone/computer that opens this file,
// with no setup. Anyone who can open the page source can read it, so use a key with a spending limit.
const BUILT_IN_AI = { provider: 'gemini', key: '', model: '' };
const cleanAI = (c) => ({ provider: c && c.provider === 'openai' ? 'openai' : 'gemini', key: (c && c.key) || '', model: (c && c.model) || '' });
// the key the administrator saved on this device wins; otherwise use the built-in one (if any)
const loadAI = () => { const c = cleanAI(load(LS_AI, null)); return c.key ? c : cleanAI(BUILT_IN_AI); };

const imageToJpeg = (file, max = 1400) => new Promise((resolve, reject) => {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * s));
    c.height = Math.max(1, Math.round(img.height * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    resolve(c.toDataURL('image/jpeg', 0.85));
  };
  img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
  img.src = url;
});

const scanPrompt = (kind) => (kind === 'order'
  ? `You read a screenshot or photo from a food delivery rider app. Find the order number and the times. Reply with JSON only: {"orderNo": digits only as a string or null, "date": "YYYY-MM-DD" or null, "acceptTime": "HH:mm" in 24-hour time or null, "deliveryTime": "HH:mm" in 24-hour time or null}. acceptTime is when the rider accepted or received the order. deliveryTime is when the order was delivered or completed. Convert AM/PM to 24-hour time. Use null for anything you cannot read clearly. Never guess. Today is ${today()}.`
  : `You read a photo of a fuel station receipt or a vehicle odometer. Reply with JSON only: {"odometer": digits only as a string or null, "amount": total money paid as a number or null, "liters": liters of fuel as a number or null, "date": "YYYY-MM-DD" or null, "time": "HH:mm" in 24-hour time or null}. odometer is the total distance shown in kilometers, not the trip meter. Use null for anything you cannot read clearly. Never guess. Today is ${today()}.`);

const cleanTime = (v) => {
  const m = /(\d{1,2})\s*[:.]\s*(\d{2})\s*([ap])?\.?\s*m?/i.exec(String(v || ''));
  if (!m) return '';
  let h = parseInt(m[1], 10);
  const mi = parseInt(m[2], 10);
  if (m[3]) { const pm = m[3].toLowerCase() === 'p'; if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12; }
  if (h > 23 || mi > 59) return '';
  return `${String(h).padStart(2, '0')}:${String(mi).padStart(2, '0')}`;
};

const sanitizeScan = (kind, raw) => {
  const d = /^\d{4}-\d{2}-\d{2}$/.test(String(raw.date || '')) && mt(raw.date, DATE_FMT).isValid() ? raw.date : '';
  if (kind === 'order') {
    const out = { orderNo: String(raw.orderNo || '').replace(/\D/g, '').slice(0, 12), date: d, accept: cleanTime(raw.acceptTime), delivery: cleanTime(raw.deliveryTime) };
    return out.orderNo || out.accept || out.delivery ? out : null;
  }
  const amount = parseFloat(raw.amount);
  const liters = parseFloat(raw.liters);
  const out = { odo: String(raw.odometer || '').replace(/\D/g, '').slice(0, 9), amount: amount > 0 ? r2(amount) : 0, liters: liters > 0 ? r2(liters) : 0, date: d, time: cleanTime(raw.time) };
  return out.odo || out.amount || out.liters ? out : null;
};

const aiError = (code, detail) => { const e = new Error(code); e.code = code; e.detail = detail; return e; };
async function callAI({ provider, key, model, kind, dataUrl }) {
  const prompt = scanPrompt(kind);
  const mdl = model || AI_DEFAULTS[provider];
  let res;
  try {
    if (provider === 'openai') {
      res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}` },
        body: JSON.stringify({ model: mdl, response_format: { type: 'json_object' }, messages: [{ role: 'user', content: [{ type: 'text', text: prompt }, { type: 'image_url', image_url: { url: dataUrl } }] }] })
      });
    } else {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mdl)}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: dataUrl.split(',')[1] } }] }], generationConfig: { temperature: 0, responseMimeType: 'application/json' } })
      });
    }
  } catch (e) { throw aiError('net'); }
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  if (!res.ok) throw aiError(res.status === 429 || res.status >= 500 ? 'quota' : 'key', (body && body.error && (body.error.message || body.error.status)) || `HTTP ${res.status}`);
  let text = '';
  if (provider === 'openai') text = body && body.choices && body.choices[0] && body.choices[0].message ? body.choices[0].message.content : '';
  else text = body && body.candidates && body.candidates[0] && body.candidates[0].content && body.candidates[0].content.parts ? body.candidates[0].content.parts.map((p) => p.text || '').join('') : '';
  const m = String(text || '').match(/\{[\s\S]*\}/);
  if (!m) throw aiError('parse');
  try { return JSON.parse(m[0]); } catch (e) { throw aiError('parse'); }
}

function ScanModal({ onClose, onResult, isAdmin, onOpenSettings }) {
  const { t } = useI18n();
  const [kind, setKind] = useState('order');
  const [img, setImg] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const camRef = useRef(null);
  const galRef = useRef(null);
  const alive = useRef(true);
  useEffect(() => () => { alive.current = false; }, []);
  const hasKey = !!loadAI().key;
  const noKeyText = t(isAdmin ? 'scan.noKeyAdmin' : 'scan.noKeyUser');

  async function run(dataUrl, conf, k) {
    setBusy(true); setErr(null);
    try {
      const raw = await callAI({ ...conf, kind: k, dataUrl });
      const data = sanitizeScan(k, raw);
      if (!data) { if (alive.current) setErr({ text: t('scan.nothing') }); return; }
      onResult(k, data);
    } catch (e) {
      const map = { net: 'scan.errNet', quota: 'scan.errQuota', parse: 'scan.errParse', key: 'scan.errKey' };
      // users cannot fix a bad key, so tell them to contact the administrator instead of showing details
      const detail = isAdmin && e.detail ? String(e.detail).slice(0, 220) : '';
      if (alive.current) setErr({ text: t(map[e.code] || 'scan.errNet'), detail });
    } finally {
      if (alive.current) setBusy(false);
    }
  }

  async function onFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setErr(null);
    let url = '';
    try { url = await imageToJpeg(file); } catch (x) { setErr({ text: t('scan.errImage') }); return; }
    setImg(url);
    const conf = loadAI();
    if (!conf.key) { setErr({ text: noKeyText }); return; }
    run(url, conf, kind);
  }

  return (
    <Modal title={t('scan.title')} icon="camera" onClose={onClose}
      footer={(
        <>
          <button type="button" className="btn btn-quiet" onClick={onClose}>{t('btn.close')}</button>
          {!hasKey && isAdmin && <button type="button" className="btn btn-primary" onClick={onOpenSettings}><Icon n="gear" /> {t('scan.goSettings')}</button>}
          {img && !busy && hasKey && <button type="button" className="btn" onClick={() => run(img, loadAI(), kind)}><Icon n="rotate" /> {t('scan.again')}</button>}
        </>
      )}>
      <p className="calc-note">{t('scan.hint')}</p>
      {!hasKey && <div className="err" role="alert"><Icon n="circle-exclamation" /><span>{noKeyText}</span></div>}
      <div className="seg scan-kind" role="group" aria-label={t('scan.title')}>
        <button type="button" aria-pressed={kind === 'order'} onClick={() => setKind('order')}>{t('scan.kindOrder')}</button>
        <button type="button" aria-pressed={kind === 'fuel'} onClick={() => setKind('fuel')}>{t('scan.kindFuel')}</button>
      </div>
      <div className="scan-actions">
        <button type="button" className="scan-btn" disabled={busy || !hasKey} onClick={() => camRef.current && camRef.current.click()}><Icon n="camera" />{t('scan.take')}</button>
        <button type="button" className="scan-btn" disabled={busy || !hasKey} onClick={() => galRef.current && galRef.current.click()}><Icon n="image" />{t('scan.choose')}</button>
      </div>
      <input ref={camRef} id="scan-cam" type="file" accept="image/*" capture="environment" hidden onChange={onFile} />
      <input ref={galRef} id="scan-gal" type="file" accept="image/*" hidden onChange={onFile} />
      {img && <img className="scan-preview" src={img} alt="" />}
      {busy && <div className="scan-busy" role="status"><i className="fa-solid fa-spinner spin" aria-hidden="true"></i> {t('scan.reading')}</div>}
      {err && <div className="err" role="alert"><Icon n="circle-exclamation" /><span>{err.text}{err.detail ? <span className="detail">{err.detail}</span> : null}</span></div>}
    </Modal>
  );
}

/* ---------- administrator-only AI key settings (shown in Employees > Settings) ---------- */
function AiSettings() {
  const { t } = useI18n();
  const [ai, setAi] = useState(() => cleanAI(load(LS_AI, null)));
  const [saved, setSaved] = useState(() => !!cleanAI(load(LS_AI, null)).key);
  const [showKey, setShowKey] = useState(false);
  const builtIn = !saved && !!cleanAI(BUILT_IN_AI).key;

  function saveKey() {
    const next = { ...ai, key: ai.key.trim(), model: ai.model.trim() };
    if (!next.key) { Dlg.fire({ icon: 'warning', text: t('ai.keyEmpty') }); return; }
    setAi(next); save(LS_AI, next); setSaved(true);
    Toast.fire({ icon: 'success', title: t('scan.aiSaved') });
  }
  function clearKey() {
    const next = { ...ai, key: '' };
    setAi(next); save(LS_AI, next); setSaved(false); setShowKey(false);
    Toast.fire({ icon: 'success', title: t('ai.cleared') });
  }

  return (
    <div>
      <h3>{t('ai.title')}</h3>
      <p>{t('ai.help')}</p>
      <p style={{ color: saved || builtIn ? 'var(--ok)' : 'var(--danger)', fontWeight: 600 }}><Icon n={saved || builtIn ? 'circle-check' : 'circle-exclamation'} /> {saved ? t('ai.on') : builtIn ? t('ai.builtIn') : t('ai.off')}</p>
      <div style={{ display: 'grid', gap: 10 }}>
        <div className="field"><label htmlFor="a-prov">{t('scan.provider')}</label>
          <select id="a-prov" className="input" value={ai.provider} onChange={(e) => setAi((p) => ({ ...p, provider: e.target.value, model: '' }))}>
            <option value="gemini">{t('scan.gemini')}</option>
            <option value="openai">{t('scan.openai')}</option>
          </select>
        </div>
        <div className="field"><label htmlFor="a-model">{t('scan.model')}</label>
          <input id="a-model" dir="ltr" className="input num" type="text" autoComplete="off" spellCheck="false" placeholder={AI_DEFAULTS[ai.provider]} value={ai.model} onChange={(e) => setAi((p) => ({ ...p, model: e.target.value }))} />
        </div>
        <div className="field"><label htmlFor="a-key">{t('scan.key')}</label>
          <div className="pwrap">
            <input id="a-key" dir="ltr" className="input" type={showKey ? 'text' : 'password'} autoComplete="off" spellCheck="false" value={ai.key} onChange={(e) => setAi((p) => ({ ...p, key: e.target.value }))} />
            <button type="button" className="icon-btn" aria-label={showKey ? t('login.hide') : t('login.show')} onClick={() => setShowKey((s) => !s)}><Icon n={showKey ? 'eye-slash' : 'eye'} /></button>
          </div>
        </div>
        <div className="row" style={{ display: 'flex', flexWrap: 'wrap', gap: 10 }}>
          <button type="button" className="btn btn-primary" onClick={saveKey}><Icon n="floppy-disk" /> {t('scan.saveAI')}</button>
          {saved && <button type="button" className="btn btn-quiet" onClick={clearKey}><Icon n="trash" /> {t('ai.clear')}</button>}
        </div>
      </div>
    </div>
  );
}

/* ---------- "More" menu used by the mobile bottom bar ---------- */
function MoreSheet({ me, isStaff, lang, setLang, onTab, onSop, onPassword, onLogout, onClose }) {
  const { t } = useI18n();
  const go = (fn) => () => { onClose(); fn(); };
  return (
    <Modal title={me.name} icon="user" onClose={onClose}
      footer={<button type="button" className="btn btn-primary" onClick={onClose}>{t('btn.close')}</button>}>
      <div><RoleBadge role={me.role} /></div>
      <div className="menu">
        {isStaff && <button type="button" className="menu-btn" onClick={go(() => onTab('employees'))}><Icon n="users" /> {t('tab.employees')}</button>}
        <button type="button" className="menu-btn" onClick={go(onSop)}><Icon n="book" /> {t('sop.title')}</button>
        <button type="button" className="menu-btn" onClick={go(onPassword)}><Icon n="key" /> {t('nav.password')}</button>
        <button type="button" className="menu-btn danger" onClick={go(onLogout)}><Icon n="right-from-bracket" /> {t('nav.logout')}</button>
      </div>
      <LangPick lang={lang} setLang={setLang} light />
    </Modal>
  );
}

/* ---------- login page ---------- */
function LoginPage({ users, onLogin, lang, setLang }) {
  const { t } = useI18n();
  const [username, setUsername] = useState('');
  const [pass, setPass] = useState('');
  const [show, setShow] = useState(false);
  const [keep, setKeep] = useState(true);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const firstTime = users.some((u) => u.defaultPw);

  async function submit(e) {
    e.preventDefault();
    if (busy) return;
    setBusy(true); setErr('');
    const u = users.find((x) => x.username.toLowerCase() === username.trim().toLowerCase());
    const ok = u ? await checkPw(pass, u) : false;
    if (!ok) { await new Promise((r) => setTimeout(r, 350)); setErr(t('login.bad')); setBusy(false); return; }
    if (!u.active) { setErr(t('login.inactive')); setBusy(false); return; }
    onLogin(u.id, keep);
  }

  return (
    <div className="login">
      <aside className="login-side" aria-label={t('login.sopTitle')}>
        <div className="login-brand">
          <Logo />
          <div><div className="brand-name">Keeta</div><div className="brand-sub">{t('login.tag')}</div></div>
        </div>
        <div>
          <h2>{t('login.sopTitle')}</h2>
          <p className="lead">{t('login.sopSub')}</p>
        </div>
        <SopFlow />
      </aside>
      <main className="login-main">
        <div className="login-lang"><LangPick lang={lang} setLang={setLang} light /></div>
        <form className="login-card" onSubmit={submit} noValidate>
          <div><h1>{t('login.title')}</h1><p className="lead">{t('login.sub')}</p></div>
          <div className="field">
            <label htmlFor="l-user">{t('login.user')}</label>
            <div className="iwrap"><Icon n="user" /><input id="l-user" dir="ltr" className="input" type="text" autoComplete="username" autoCapitalize="none" spellCheck="false" placeholder={t('login.userPh')} value={username} onChange={(e) => setUsername(e.target.value)} autoFocus /></div>
          </div>
          <div className="field">
            <label htmlFor="l-pass">{t('login.pass')}</label>
            <div className="pwrap">
              <input id="l-pass" dir="ltr" className="input" type={show ? 'text' : 'password'} autoComplete="current-password" placeholder={t('login.passPh')} value={pass} onChange={(e) => setPass(e.target.value)} />
              <button type="button" className="icon-btn" aria-label={show ? t('login.hide') : t('login.show')} title={show ? t('login.hide') : t('login.show')} onClick={() => setShow((s) => !s)}><Icon n={show ? 'eye-slash' : 'eye'} /></button>
            </div>
          </div>
          <label className="check"><input type="checkbox" checked={keep} onChange={(e) => setKeep(e.target.checked)} /> {t('login.keep')}</label>
          {err && <div className="err" role="alert"><Icon n="circle-exclamation" /> {err}</div>}
          <button type="submit" className="btn btn-primary btn-block" disabled={busy || !username || !pass}><Icon n="right-to-bracket" /> {t('login.btn')}</button>
          {firstTime && <div className="note"><Icon n="circle-info" /><span>{t('login.first')}</span></div>}
        </form>
        <RoleList />
      </main>
    </div>
  );
}

/* ---------- app ---------- */
function detectLang() {
  const saved = load(LS_LANG, null);
  if (saved && LANGS.some((l) => l.code === saved)) return saved;
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return LANGS.some((l) => l.code === nav) ? nav : 'en';
}

function App() {
  const [orders, setOrders] = useState(() => load(LS_ORDERS, []));
  const [fuel, setFuel] = useState(() => load(LS_FUEL, []));
  const [users, setUsers] = useState(() => load(LS_USERS, []));
  const [price, setPrice] = useState(() => String(load(LS_PRICE, DEFAULT_PRICE)));
  const [lang, setLang] = useState(detectLang);
  const [tab, setTab] = useState('orders');
  const [sessionId, setSessionId] = useState(readSession);
  const [dialog, setDialog] = useState(null); // 'sop' | 'password' | 'scan' | 'more'
  const [scanned, setScanned] = useState(null);
  const [aiRev, setAiRev] = useState(0);
  const [booting, setBooting] = useState(() => load(LS_USERS, []).length === 0);

  useEffect(() => { save(LS_ORDERS, orders); }, [orders]);
  useEffect(() => { save(LS_FUEL, fuel); }, [fuel]);
  useEffect(() => { if (users.length) save(LS_USERS, users); }, [users]);
  useEffect(() => { save(LS_PRICE, price); }, [price]);

  // first run: create the default administrator
  useEffect(() => {
    if (users.length) return;
    (async () => {
      const salt = randSalt();
      const admin = { id: uid(), createdAt: Date.now(), empNo: 'EMP-001', name: 'Administrator', role: 'admin', username: 'admin', salt, hash: await hashPw('admin123', salt), active: true, iqama: '', iqamaExp: '', nation: '', phone: '', plate: '', vtype: 'motorcycle', allowance: 0, joined: today(), defaultPw: true };
      setUsers([admin]);
      setBooting(false);
    })();
  }, []);

  const me = users.find((u) => u.id === sessionId && u.active) || null;
  useEffect(() => { if (sessionId && users.length && !me) { writeSession(null); setSessionId(null); } }, [sessionId, users, me]);

  const info = LANGS.find((l) => l.code === lang) || LANGS[0];
  MLOC = info.moment; // read by the date formatters during this render
  useEffect(() => {
    document.documentElement.lang = info.code;
    document.documentElement.dir = info.dir;
    save(LS_LANG, info.code);
  }, [info.code]);
  const ctx = useMemo(() => {
    const t = makeT(info.code);
    return { lang: info.code, dir: info.dir, t, dur: durFormatter(t) };
  }, [info.code]);
  const t = ctx.t;

  const isStaff = !!me && me.role !== 'user';
  const tabs = [['orders', 'table-list', 'tab.orders'], ['fuel', 'gas-pump', 'tab.fuel'], ['report', 'chart-column', 'tab.report'], ...(isStaff ? [['employees', 'users', 'tab.employees']] : [])];
  const active = tabs.some((x) => x[0] === tab) ? tab : 'orders';

  function login(id, keep) { writeSession(id, keep); setSessionId(id); setTab('orders'); }
  function onScanResult(kind, data) { setScanned({ id: Date.now(), kind, data }); setTab(kind === 'order' ? 'orders' : 'fuel'); setDialog(null); }
  function logout() { writeSession(null); setSessionId(null); setDialog(null); }
  async function changePassword(next) {
    const salt = randSalt();
    const hash = await hashPw(next, salt);
    setUsers((l) => l.map((u) => (u.id === me.id ? { ...u, salt, hash, defaultPw: false } : u)));
    Toast.fire({ icon: 'success', title: t('toast.pwSaved') });
  }
  const backupData = () => { const k = cleanAI(load(LS_AI, null)); return { app: 'keeta', version: 2, exportedAt: new Date().toISOString(), price, orders, fuel, users, ...(k.key ? { ai: k } : {}) }; };
  const restoreAll = (d) => { setOrders(d.orders); setFuel(d.fuel); setUsers(d.users); if (d.price) setPrice(String(d.price)); if (d.ai && d.ai.key) { save(LS_AI, cleanAI(d.ai)); setAiRev((n) => n + 1); } };

  // nudge the administrator to replace the default password
  const nudged = useRef(false);
  useEffect(() => {
    if (me && me.defaultPw && !nudged.current) {
      nudged.current = true;
      Dlg.fire({ icon: 'warning', title: t('pw.defTitle'), text: t('pw.defText'), showCancelButton: true, confirmButtonText: t('pw.title'), cancelButtonText: t('pw.later') })
        .then((r) => { if (r.isConfirmed) setDialog('password'); });
    }
  }, [me && me.id]);

  if (booting) return null;

  if (!me) {
    return (
      <LangCtx.Provider value={ctx}>
        <LoginPage users={users} onLogin={login} lang={lang} setLang={setLang} />
      </LangCtx.Provider>
    );
  }

  return (
    <LangCtx.Provider value={ctx}>
      <header className="topbar no-print">
        <div className="topbar-in">
          <div className="brand">
            <Logo />
            <div>
              <div className="brand-name">Keeta</div>
              <div className="brand-sub">{t('app.sub')} · {fm(moment(), 'ddd, DD MMM YYYY')}</div>
            </div>
          </div>
          <button type="button" className="btn btn-primary scan-top" onClick={() => setDialog('scan')}><Icon n="camera" /> {t('nav.scan')}</button>
          <LangPick lang={lang} setLang={setLang} />
          <div className="userchip">
            <div className="who"><b>{me.name}</b><RoleBadge role={me.role} /></div>
            <button type="button" className="tb-btn" title={t('nav.sop')} aria-label={t('nav.sop')} onClick={() => setDialog('sop')}><Icon n="book" /></button>
            <button type="button" className="tb-btn" title={t('nav.password')} aria-label={t('nav.password')} onClick={() => setDialog('password')}><Icon n="key" /></button>
            <button type="button" className="tb-btn" title={t('nav.logout')} aria-label={t('nav.logout')} onClick={logout}><Icon n="right-from-bracket" /></button>
          </div>
        </div>
        <div className="tabs" role="tablist">
          {tabs.map(([k, ic, label]) => (
            <button key={k} type="button" role="tab" className="tab" aria-selected={active === k} onClick={() => setTab(k)}><Icon n={ic} /> {t(label)}</button>
          ))}
        </div>
      </header>
      <main className="page">
        {active === 'orders' && <OrdersTab orders={orders} setOrders={setOrders} users={users} me={me} scanned={scanned} onScanUsed={() => setScanned(null)} />}
        {active === 'fuel' && <FuelTab fuel={fuel} setFuel={setFuel} users={users} me={me} price={price} scanned={scanned} onScanUsed={() => setScanned(null)} />}
        {active === 'report' && <ReportTab orders={orders} fuel={fuel} users={users} me={me} />}
        {active === 'employees' && isStaff && <EmployeesTab key={aiRev} users={users} setUsers={setUsers} fuel={fuel} me={me} price={price} setPrice={setPrice} restoreAll={restoreAll} backupData={backupData} />}
      </main>
      <nav className="bottomnav no-print" aria-label={t('app.sub')}>
        {[['orders', 'table-list', 'tab.orders'], ['fuel', 'gas-pump', 'tab.fuel']].map(([k, ic, label]) => (
          <button key={k} type="button" className="bn-item" aria-current={active === k ? 'page' : undefined} onClick={() => setTab(k)}><Icon n={ic} /><span>{t(label)}</span></button>
        ))}
        <button type="button" className="bn-item bn-scan" onClick={() => setDialog('scan')}><Icon n="camera" /><span>{t('nav.scan')}</span></button>
        <button type="button" className="bn-item" aria-current={active === 'report' ? 'page' : undefined} onClick={() => setTab('report')}><Icon n="chart-column" /><span>{t('tab.report')}</span></button>
        <button type="button" className="bn-item" aria-current={active === 'employees' ? 'page' : undefined} onClick={() => setDialog('more')}><Icon n="bars" /><span>{t('nav.more')}</span></button>
      </nav>
      {dialog === 'scan' && <ScanModal onClose={() => setDialog(null)} onResult={onScanResult} isAdmin={me.role === 'admin'} onOpenSettings={() => { setDialog(null); setTab('employees'); }} />}
      {dialog === 'more' && <MoreSheet me={me} isStaff={isStaff} lang={lang} setLang={setLang} onTab={setTab} onSop={() => setDialog('sop')} onPassword={() => setDialog('password')} onLogout={logout} onClose={() => setDialog(null)} />}
      {dialog === 'sop' && <SopModal onClose={() => setDialog(null)} />}
      {dialog === 'password' && <PasswordModal me={me} onSave={changePassword} onClose={() => setDialog(null)} />}
      <Watermark />
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
